<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOTICE BOARD</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header Section -->
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <h1 class="brand-title">NOTICE BOARD</h1>
        <p class="brand-sub">Public announcements, archives, and updates</p>
      </div>
    </div>
  </header>

  <!-- Control & Filter Toolbar -->
  <section class="toolbar-section">
    <div class="toolbar-inner">
      <div class="search-box">
        <span class="search-label">SEARCH</span>
        <input type="text" id="search-input" placeholder="Type keywords..." autocomplete="off">
        <button id="search-clear-btn" class="btn-icon-inline" title="Clear search">&times;</button>
      </div>

      <div class="filter-group">
        <span class="filter-label">FILTER:</span>
        <div class="filter-tabs" id="filter-tabs">
          <button class="tab active" data-filter="all">ALL (<span id="count-all">0</span>)</button>
          <button class="tab" data-filter="pinned">PINNED (<span id="count-pinned">0</span>)</button>
          <button class="tab" data-filter="urgent">URGENT (<span id="count-urgent">0</span>)</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <main class="main-container">
    <!-- Notice Board Grid -->
    <div id="notices-grid" class="notices-grid">
      <!-- Injected dynamically via app.js -->
    </div>

    <!-- Empty State Message -->
    <div id="empty-state" class="empty-state" style="display: none;">
      <div class="empty-box">
        <div class="empty-code">[ NO NOTICES ]</div>
        <h2>No notices found</h2>
        <p>There are currently no notices matching this view.</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div>NOTICE BOARD ARCHIVE</div>
      <div>MONOCHROME EDITION</div>
    </div>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
